<body class="animated-bg text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">

    <!-- 🌟 PANTALLA DE CARGA (SPLASH SCREEN) -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-[#090514] flex flex-col justify-center items-center gap-4 transition-opacity duration-500">
        <div class="relative flex justify-center items-center">
            <div class="absolute w-20 h-20 bg-fuchsia-500/20 rounded-full animate-ping"></div>

            <div class="flex items-center gap-3">

    <!-- Script de Iconos Lucide -->
    <script src="https://unpkg.com"></script>
    
    <script>
        // 1. DATA DE LOS CANALES (Configuración centralizada de tus transmisiones)
        const channels = [
            {
                id: 1,
                name: "Tevevida (Señal TV)",
                desc: "Transmisión de televisión digital en vivo.",
                type: "video",
                badge: "Video Live",
                src: "https://mux.dev", // Reemplaza por tu URL de streamlock
                icon: "tv"
            },
            {
                id: 2,
                name: "Radio Tiempo Final",
                desc: "Emisión radial con la mejor programación cristiana.",
                type: "audio",
                badge: "Audio Live",
                src: "https://cloudfront.net", // Reemplaza por tu streaming MP3/AAC
                icon: "mic"
            },
            {
                id: 3,
                name: "Canal Alternativo",
                desc: "Eventos especiales y transmisiones secundarias.",
                type: "video",
                badge: "Event Live",
                src: "https://longtailvideo.com",
                icon: "video"
            }
];// Inicializar Video.js de forma global y seguraconst player = videojs('universal-player', {responsive: true,fluid: true});// 2. RENDERIZADO E INTERACCIÓN DE LA PARRILLAconst container = document.getElementById('channels-container');const titleEl = document.getElementById('player-channel-title');const descEl = document.getElementById('player-channel-desc');const badgeEl = document.getElementById('media-badge');function renderChannels(activeId) {container.innerHTML = "";channels.forEach(ch => {const isActive = ch.id === activeId;const btn = document.createElement('button');btn.className = w-full flex items-center gap-3 p-3 rounded-xl border text-left transition duration-200 ${ isActive  ? 'bg-gradient-to-r from-fuchsia-600/30 to-indigo-600/20 border-fuchsia-500 text-white shadow-lg'  : 'bg-white/5 border-white/5 text-slate-300 hover:bg-white/10 hover:border-white/10' };btn.innerHTML = <div class="p-2 rounded-lg ${isActive ? 'bg-fuchsia-500 text-white' : 'bg-white/5 text-slate-400'}"> <i data-lucide="${ch.icon}" class="w-4 h-4"></i> </div> <div class="flex-grow min-w-0"> <div class="flex justify-between items-center gap-2"> <span class="font-bold text-xs truncate">${ch.name}</span> <span class="text-[8px] px-1.5 py-0.5 rounded-full border ${ isActive ? 'border-fuchsia-400/40 text-fuchsia-300' : 'border-slate-500/30 text-slate-400' }">${ch.badge}</span> </div> <p class="text-[10px] text-slate-400 truncate mt-0.5">${ch.desc}</p> </div>;btn.onclick = () => switchChannel(ch);container.appendChild(btn);});lucide.createIcons();}function switchChannel(channel) {titleEl.textContent = channel.name;descEl.textContent = channel.desc;badgeEl.textContent = channel.badge;// Cambiar dinámicamente la fuente en el reproductor de Video.jsplayer.src({ src: channel.src, type: channel.type === 'video' ? 'application/x-mpegURL' : 'audio/mpeg' });player.play().catch(err => console.log("Auto-play prevenido por el navegador."));renderChannels(channel.id);}// 3. LOGICA DEL RELOJ DIGITAL Y SPLASH SCREENfunction updateClock() {const clock = document.getElementById('digital-clock');if(clock) {const now = new Date();clock.textContent = now.toTimeString().split(' ')[0];}}setInterval(updateClock, 1000);updateClock();window.addEventListener('DOMContentLoaded', () => {lucide.createIcons();renderChannels(1); // Carga inicial canal 1setTimeout(() => {const splash = document.getElementById('splash-screen');if(splash) splash.classList.add('fade-out');}, 1500);});// 4. CONTROLADOR NATIVO SERVICE WORKER PWA (Ejecución offline y caché básico)if ('serviceWorker' in navigator) {window.addEventListener('load', () => {// Generamos un script de Service Worker virtual in-line para evitar archivos separados externos en entornos limitadosconst swCode = const CACHE_NAME = 'tiempo-final-v1'; const assets = ['/', '/index.html']; self.addEventListener('install', e => { e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(assets))); }); self.addEventListener('fetch', e => { e.respondWith(caches.match(e.request).then(res => res || fetch(e.request))); });;const blob = new Blob([swCode], { type: 'application/javascript' });const swUrl = URL.createObjectURL(blob);navigator.serviceWorker.register(swUrl).then(() => console.log('PWA Service Worker Activo de forma nativa.')).catch(err => console.error('Error al registrar PWA', err));});}// Manejador del botón de instalación de la aplicación en el dispositivolet deferredPrompt;const installBtn = document.getElementById('pwa-install-btn');window.addEventListener('beforeinstallprompt', (e) => {e.preventDefault();deferredPrompt = e;if(installBtn) installBtn.classList.remove('hidden');});if(installBtn) {installBtn.addEventListener('click', async () => {if (deferredPrompt) {deferredPrompt.prompt();const { outcome } = await deferredPrompt.userChoice;if (outcome === 'accepted') installBtn.classList.add('hidden');deferredPrompt = null;}});}
