    <style>
        /* Fondo con Degradado Líquido Ciberpunk */
        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-135deg, #0d0722, #180b3b, #3e0c66, #11052c, #020617);
            background-size: 300% 300%;
            animation: gradientBg 12s ease-in-out infinite;
        }
        
        /* Personalización Estética Neon del Reproductor Video.js */
        .video-js {
            background-color: rgba(13, 7, 34, 0.9);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.1);
        }
        .vjs-big-play-button {
            background: linear-gradient(135deg, #f43f5e, #a855f7) !important;
            border: none !important;
            border-radius: 50% !important;
            width: 3.5em !important;
            height: 3.5em !important;
            line-height: 3.5em !important;
            margin-left: -1.75em !important;
            margin-top: -1.75em !important;
            box-shadow: 0 0 30px rgba(244, 63, 94, 0.6) !important;
            transition: transform 0.2s ease-in-out !important;
        }
        .vjs-big-play-button:hover {
            transform: scale(1.1) translate(-40%, -40%);
        }

        /* Transiciones del Splash Screen */
        .fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }
        @keyframes splashProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0%); }
        }
    </style>

<body class="animated-bg text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-fuchsia-500 selection:text-white">

    <!-- 🌟 PANTALLA DE CARGA INICIAL (SPLASH SCREEN) -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-[#0d0722] flex flex-col justify-center items-center gap-6">
        <div class="relative flex justify-center items-center">
            <div class="absolute w-24 h-24 bg-rose-500/20 rounded-full animate-ping"></div>
            <div class="absolute w-32 h-32 bg-fuchsia-500/10 rounded-full animate-pulse"></div>
            <div class="bg-gradient-to-tr from-rose-500 via-fuchsia-600 to-violet-600 p-6 rounded-2xl shadow-[0_0_50px_rgba(217,70,239,0.3)] relative z-10">
                <i data-lucide="radio" class="w-12 h-12 text-white"></i>
            </div>
        </div>
        <div class="text-center mt-2">
            <h2 class="text-3xl font-black tracking-widest bg-gradient-to-r from-white via-rose-200 to-fuchsia-300 bg-clip-text text-transparent">TIEMPO FINAL</h2>
            <p class="text-xs text-rose-400 font-bold uppercase tracking-widest mt-1">Plataforma Multimedios</p>
        </div>
        <div class="w-48 h-1 bg-slate-950 rounded-full overflow-hidden border border-white/5">
            <div class="h-full bg-gradient-to-r from-rose-500 to-fuchsia-500" style="width: 100%; transform: translateX(-100%); animation: splashProgress 1.5s forwards cubic-bezier(0.4, 0, 0.2, 1);"></div>
        </div>
    </div>

    <!-- 📱 INTERFAZ PRINCIPAL -->
    <div class="w-full max-w-6xl mx-auto px-4 py-6 flex-grow flex flex-col gap-6 justify-center">
        
        <!-- HEADER: Identidad Ciberpunk y Reloj Digital -->
        <header class="w-full flex flex-col sm:flex-row justify-between items-center bg-slate-950/60 backdrop-blur-xl border border-white/10 p-5 rounded-2xl shadow-[0_4px_30px_rgba(0,0,0,0.4)] gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-rose-500 to-fuchsia-600 p-2.5 rounded-xl shadow-[0_0_15px_rgba(244,63,94,0.3)]">
                    <i data-lucide="radio" class="w-7 h-7 text-white animate-pulse"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-white via-slate-200 to-fuchsia-200 bg-clip-text text-transparent">TIEMPO FINAL</h1>
                    <p class="text-[11px] text-rose-400 font-bold tracking-widest uppercase flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-ping"></span> TRANSMISIÓN EN VIVO
                    </p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Botón de Instalación PWA Dinámico -->
                <button id="pwa-install-btn" class="hidden flex items-center gap-2 bg-gradient-to-r from-rose-500 to-fuchsia-600 hover:from-rose-600 hover:to-fuchsia-700 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-lg transition-transform active:scale-95 cursor-pointer">
                    <i data-lucide="download" class="w-4 h-4"></i> Instalar App
                </button>
                <!-- Reloj Neon -->
                <div class="flex items-center gap-2 bg-black/40 px-4 py-2 rounded-xl border border-white/5 shadow-inner">
                    <i data-lucide="clock" class="w-4 h-4 text-fuchsia-400 animate-spin" style="animation-duration: 8s;"></i>
                    <span id="digital-clock" class="font-mono text-xl font-bold bg-gradient-to-r from-rose-400 to-fuchsia-400 bg-clip-text text-transparent tracking-wider">00:00:00</span>
                </div>
            </div>
        </header>

        <!-- SECCIÓN MULTIMEDIA -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <!-- PANEL REPRODUCTOR -->
            <main class="lg:col-span-2 bg-slate-950/50 backdrop-blur-xl border border-white/10 p-5 rounded-2xl shadow-2xl flex flex-col gap-4">
                <div class="flex justify-between items-center border-b border-white/10 pb-3">
                    <div>
                        <h2 class="text-lg font-bold text-slate-100 tracking-wide" id="player-channel-title">Tevevida (Señal TV)</h2>
                        <p class="text-xs text-slate-400 mt-0.5" id="player-channel-desc">Transmisión de televisión digital en vivo.</p>
                    </div>
                    <span id="media-badge" class="bg-rose-500/10 border border-rose-500/30 text-rose-300 text-[10px] font-black px-2.5 py-1 rounded-full uppercase tracking-widest shadow-[0_0_10px_rgba(244,63,94,0.1)]">Video Live</span>
                </div>

                <!-- Contenedor de Video -->
                <div class="w-full aspect-video rounded-xl overflow-hidden border border-white/5 bg-black/80 relative">
                    <video 
                        id="universal-player" 
                        class="video-js vjs-default-skin vjs-big-play-centered w-full h-full" 
                        controls 
                        preload="auto"
                        poster="https://unsplash.com"
                    >
                        <source src="https://mux.dev" type="application/x-mpegURL" />
                    </video>
                </div>
            </main>

            <!-- LISTA DE CANALES INTERACTIVOS -->
            <aside class="bg-slate-950/50 backdrop-blur-xl border border-white/10 p-5 rounded-2xl shadow-2xl flex flex-col gap-4 h-full">
                <div>
                    <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                        <i data-lucide="layers" class="w-4 h-4 text-fuchsia-400"></i> Parrilla de Canales
                    </h3>
                    <p class="text-xs text-slate-400 mt-0.5">Selecciona tu transmisión preferida</p>
                </div>
                
                <div class="flex flex-col gap-2.5 max-h-[350px] overflow-y-auto pr-1" id="channels-container">
                    <!-- Canal 1 -->
                    <button class="channel-item w-full flex items-center justify-between p-3.5 rounded-xl border transition-all text-left group bg-gradient-to-r from-rose-500/10 to-fuchsia-500/5 border-rose-500/40 text-white shadow-[0_0_15px_rgba(244,63,94,0.05)]"
                        data-src="https://mux.dev"
                        data-type="video"
                        data-title="Tevevida (Señal TV)"
                        data-desc="Transmisión de televisión digital en vivo.">
                        <div class="flex items-center gap-3">
